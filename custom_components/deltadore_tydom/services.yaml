acknowledge_events:
  name: Acknowledge alarm events
  description: Acknowledge all unacknowledged alarm events.
  target:
    entity:
      integration: deltadore_tydom
      domain: alarm_control_panel
start_device_association:
  name: Start device association
  description: Start association mode on a TYDOM device when its endpoint advertises modeAsso with the START value.
  target:
    entity:
      integration: deltadore_tydom
identify_device:
  name: Identify device
  description: Trigger physical identification on a TYDOM device when its endpoint advertises localisation with the START value.
  target:
    entity:
      integration: deltadore_tydom
start_product_association:
  name: Start product association
  description: Start the official gateway-level product-association workflow. It works with TYDOM 1.0/2.0, TYDOM Home/Pro and Tywell gateways when the selected radio family is supported by their firmware. Target any entity of the desired gateway, or provide its config entry ID for an empty gateway.
  target:
    entity:
      integration: deltadore_tydom
  fields:
    config_entry_id:
      name: TYDOM config entry ID
      description: Alternative target for a gateway that has no entities yet.
      required: false
      selector:
        text:
    profile:
      name: Product family
      description: Radio/product family to put into association mode.
      required: true
      selector:
        select:
          options:
            - label: TYXAL / alarm X2D
              value: alarm_x2d
            - label: TYXAL+ / alarm X3D
              value: alarm_x3d
            - label: Aéraulique Zigbee
              value: aeraulic_zigbee
            - label: Store banne X3D
              value: awning_x3d
            - label: Chaudière Drive X3D
              value: boiler_drive_x3d
            - label: Contrôleur X3D
              value: controller_x3d
            - label: Détecteur X3D
              value: detector_x3d
            - label: Équipement électrique Zigbee
              value: electric_zigbee
            - label: Éclairage X3D
              value: light_x3d
            - label: Éclairage Zigbee
              value: light_zigbee
            - label: Produit générique X3D
              value: generic_x3d
            - label: Compteur / mesure X3D
              value: meter_x3d
            - label: Produit multifonction X3D
              value: multi_x3d
            - label: Ouvrant / porte / fenêtre X3D
              value: opening_x3d
            - label: Produit POD X3D
              value: pod_x3d
            - label: Télécommande X3D
              value: remote_x3d
            - label: Mesure RT2012 X3D
              value: rt2012_measure_x3d
            - label: RT2012 sans sonde extérieure X3D
              value: rt2012_no_outdoor_temp_x3d
            - label: RT2012 X3D
              value: rt2012_x3d
            - label: Capteur X3D
              value: sensor_x3d
            - label: Chauffage partagé X3D
              value: shared_thermic_x3d
            - label: Volet roulant X3D
              value: shutter_x3d
            - label: Volet Activ'Home X3D
              value: shutter_activhome_x3d
            - label: Volet Brushless X3D
              value: shutter_brushless_x3d
            - label: Volet projeté X3D
              value: shutter_projected_x3d
            - label: Volet Profalux Zigbee
              value: shutter_profalux_zigbee
            - label: Volet RMLP X3D
              value: shutter_rmlp_x3d
            - label: Volet Stella Zigbee
              value: shutter_stella_zigbee
            - label: Volet roulant Zigbee
              value: shutter_zigbee
            - label: Sonde de température X3D
              value: temperature_x3d
            - label: Chauffage X3D
              value: thermic_x3d
            - label: Chauffage X2D
              value: thermic_x2d
            - label: Chauffage X3D (émetteur spécifique)
              value: thermic_x3d_es
            - label: Chauffage Zigbee
              value: thermic_zigbee
            - label: TYPASS ATL X3D
              value: typass_atl_x3d
            - label: TYPASS Saunier X3D
              value: typass_saunier_x3d
            - label: Station météo
              value: weather_plt
    network:
      name: Radio network
      description: Optional radio network number. Zigbee defaults to network 0, as in the official application.
      required: false
      selector:
        number:
          min: 0
          mode: box
remove_product_association:
  name: Remove associated product
  description: Permanently remove the selected product from its TYDOM/Tywell gateway. This is not limited to deleting the Home Assistant entity.
  target:
    entity:
      integration: deltadore_tydom
  fields:
    confirm:
      name: Confirm permanent removal
      description: Must be enabled to remove the selected product from the gateway.
      required: true
      selector:
        boolean:
force_arm:
  name: Force arm alarm
  description: Explicitly force the selected alarm mode despite defects that caused normal arming to be refused. Use only after checking those defects.
  target:
    entity:
      integration: deltadore_tydom
      domain: alarm_control_panel
  fields:
    code:
      name: TYXAL user code
      description: User code authorised to arm the alarm.
      required: true
      selector:
        text:
          type: password
    mode:
      name: Arming mode
      description: Configured Home Assistant alarm mode to force.
      required: true
      selector:
        select:
          options:
            - label: Away
              value: away
            - label: Home
              value: home
            - label: Night
              value: night
get_events:
  name: Get alarm events
  description: Retrieve alarm events from the system. Returns a list of events based on the selected filter.
  target:
    entity:
      integration: deltadore_tydom
      domain: alarm_control_panel
  fields:
    event_type:
      name: Event type filter
      description: Filter the events to retrieve
      required: false
      default: "UNACKED_EVENTS"
      selector:
        select:
          options:
            - label: All events
              value: ALL
            - label: Unacknowledged events
              value: UNACKED_EVENTS
            - label: Activation/Deactivation events
              value: ON_OFF
            - label: All alarm events
              value: EVENTS
get_alarm_products:
  name: Get alarm products and zones
  description: Retrieve the products and zones configured on a TYXAL alarm. This service does not require the alarm PIN.
  target:
    entity:
      integration: deltadore_tydom
      domain: alarm_control_panel
get_alarm_product_configuration:
  name: Get alarm product configuration
  description: Retrieve the active state and zone assignment of a TYXAL alarm product while the CS8000 is in maintenance mode.
  target:
    entity:
      integration: deltadore_tydom
      domain: alarm_control_panel
  fields:
    code:
      name: TYXAL installer code
      description: Installer code used while the CS8000 is in maintenance mode.
      required: true
      selector:
        text:
          type: password
    product_id:
      name: Product ID
      description: Product identifier returned by Get alarm products and zones.
      required: true
      selector:
        number:
          min: 0
          mode: box
enter_alarm_maintenance:
  name: Enter alarm maintenance mode
  description: Put a disarmed TYXAL CS8000 into maintenance mode before reading or changing its configuration.
  target:
    entity:
      integration: deltadore_tydom
      domain: alarm_control_panel
  fields:
    code:
      name: TYXAL installer code
      description: Installer code for the CS8000. Do not use an ordinary user alarm code.
      required: true
      selector:
        text:
          type: password
exit_alarm_maintenance:
  name: Exit alarm maintenance mode
  description: Return a TYXAL CS8000 from maintenance mode to its normal disarmed state.
  target:
    entity:
      integration: deltadore_tydom
      domain: alarm_control_panel
  fields:
    code:
      name: TYXAL installer code
      description: Installer code for the CS8000.
      required: true
      selector:
        text:
          type: password
configure_alarm_product:
  name: Configure alarm product
  description: Enable or disable a TYXAL product, assign it to a zone, or perform both changes together.
  target:
    entity:
      integration: deltadore_tydom
      domain: alarm_control_panel
  fields:
    code:
      name: TYXAL installer code
      description: Installer code used while the CS8000 is in maintenance mode.
      required: true
      selector:
        text:
          type: password
    product_id:
      name: Product ID
      description: Product identifier returned by Get alarm products and zones.
      required: true
      selector:
        number:
          min: 0
          mode: box
    active:
      name: Active
      description: Whether the product should participate in the alarm system. Leave empty to keep its current setting.
      required: false
      selector:
        boolean:
    zone:
      name: Zone
      description: Zone to which the product should be assigned. Leave empty to keep its current assignment.
      required: false
      selector:
        number:
          min: 0
          max: 7
          mode: box
rename_alarm_zone:
  name: Rename alarm zone
  description: Change the custom name of one TYXAL alarm zone, or clear it by supplying an empty name.
  target:
    entity:
      integration: deltadore_tydom
      domain: alarm_control_panel
  fields:
    code:
      name: TYXAL installer code
      description: Installer code used while the CS8000 is in maintenance mode.
      required: true
      selector:
        text:
          type: password
    zone_id:
      name: Zone ID
      description: Zone identifier returned by Get alarm products and zones.
      required: true
      selector:
        number:
          min: 0
          max: 7
          mode: box
    name:
      name: Zone name
      description: New custom name for the zone. Supply an empty string to clear its custom or standard label.
      required: true
      selector:
        text:
reload_devices:
  name: Reload devices
  description: Recharger tous les appareils et entités comme au démarrage initial. Cette action supprime toutes les entités existantes et les recrée depuis zéro.
activate_group_scenario:
  name: Activate scenario on group
  description: Activate a scenario on a Tydom group
  target:
    entity:
      integration: deltadore_tydom
      domain: button
  fields:
    scenario_id:
      name: Scenario ID
      description: The ID of the scenario to activate
      required: true
      selector:
        text:
create_scene:
  name: Create or update scene
  description: Create or update a Tydom scene with specific entities. This allows you to modify which entities are controlled by a Tydom scene in Home Assistant.
  target:
    entity:
      integration: deltadore_tydom
      domain: scene
  fields:
    entities:
      name: Entities
      description: Dictionary of entities and their states to include in the scene
      required: true
      selector:
        object:
control_group:
  name: Control group
  description: Control a Tydom group with specific action (turn on/off, open/close, stop, set position)
  target:
    entity:
      integration: deltadore_tydom
      domain: button
  fields:
    action:
      name: Action
      description: Action to perform on the group
      required: true
      selector:
        select:
          options:
            - label: Turn on
              value: turn_on
            - label: Turn off
              value: turn_off
            - label: Open
              value: open
            - label: Close
              value: close
            - label: Stop
              value: stop
            - label: Set position
              value: set_position
    position:
      name: Position
      description: Position for covers (0-100), required when action is set_position
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 1
get_group_devices:
  name: Get group devices
  description: Get the list of devices in a Tydom group
  target:
    entity:
      integration: deltadore_tydom
      domain: button
