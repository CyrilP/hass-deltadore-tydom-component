set_local_gateway_password:
  name: Set local gateway password
  description: >-
    Change the local Digest password of a directly connected TYDOM or Tywell
    gateway. For a gateway configured through Delta Dore cloud mediation,
    provide its LAN host so the change is still sent locally. This does not
    reset the gateway and never sends the password-change request through the
    Delta Dore cloud. The gateway may reject the request when its firmware
    does not support local password changes.
  fields:
    device_id:
      name: Gateway device
      description: >-
        Select the directly connected TYDOM or Tywell gateway. Connected
        products such as shutters, lights, thermostats, and alarms are refused.
      required: true
      selector:
        device:
          integration: deltadore_tydom
    local_host:
      name: Local gateway host
      description: >-
        LAN IP address or hostname of the selected gateway. Required only when
        that gateway is configured through Delta Dore cloud mediation.
      required: false
      selector:
        text:
    new_password:
      name: New local gateway password
      description: At least 8 characters, including at least one letter and one digit.
      required: true
      selector:
        text:
          type: password
          autocomplete: new-password
    confirm:
      name: Confirm password change
      description: Set to true only after confirming that the selected local gateway is correct.
      required: true
      selector:
        boolean:
acknowledge_events:
  name: Acknowledge alarm events
  description: Acknowledge all unacknowledged alarm events.
  target:
    entity:
      integration: deltadore_tydom
      domain: alarm_control_panel
force_arm:
  name: Force arm alarm
  description: Explicitly force the selected alarm mode despite defects that caused normal arming to be refused. Use only after checking those defects.
  target:
    entity:
      integration: deltadore_tydom
      domain: alarm_control_panel
  fields:
    code:
      name: TYXAL user code
      description: User code authorised to arm the alarm.
      required: true
      selector:
        text:
          type: password
    mode:
      name: Arming mode
      description: Configured Home Assistant alarm mode to force.
      required: true
      selector:
        select:
          options:
            - label: Away
              value: away
            - label: Home
              value: home
            - label: Night
              value: night
get_events:
  name: Get alarm events
  description: Retrieve alarm events from the system. Returns a list of events based on the selected filter.
  target:
    entity:
      integration: deltadore_tydom
      domain: alarm_control_panel
  fields:
    event_type:
      name: Event type filter
      description: Filter the events to retrieve
      required: false
      default: "UNACKED_EVENTS"
      selector:
        select:
          options:
            - label: All events
              value: ALL
            - label: Unacknowledged events
              value: UNACKED_EVENTS
            - label: Activation/Deactivation events
              value: ON_OFF
            - label: All alarm events
              value: EVENTS
get_alarm_products:
  name: Get alarm products and zones
  description: Retrieve the products and zones configured on a TYXAL alarm. This service does not require the alarm PIN.
  target:
    entity:
      integration: deltadore_tydom
      domain: alarm_control_panel
get_alarm_product_configuration:
  name: Get alarm product configuration
  description: Retrieve the active state and zone assignment of a TYXAL alarm product while the CS8000 is in maintenance mode.
  target:
    entity:
      integration: deltadore_tydom
      domain: alarm_control_panel
  fields:
    code:
      name: TYXAL installer code
      description: Installer code used while the CS8000 is in maintenance mode.
      required: true
      selector:
        text:
          type: password
    product_id:
      name: Product ID
      description: Product identifier returned by Get alarm products and zones.
      required: true
      selector:
        number:
          min: 0
          mode: box
enter_alarm_maintenance:
  name: Enter alarm maintenance mode
  description: Put a disarmed TYXAL CS8000 into maintenance mode before reading or changing its configuration.
  target:
    entity:
      integration: deltadore_tydom
      domain: alarm_control_panel
  fields:
    code:
      name: TYXAL installer code
      description: Installer code for the CS8000. Do not use an ordinary user alarm code.
      required: true
      selector:
        text:
          type: password
exit_alarm_maintenance:
  name: Exit alarm maintenance mode
  description: Return a TYXAL CS8000 from maintenance mode to its normal disarmed state.
  target:
    entity:
      integration: deltadore_tydom
      domain: alarm_control_panel
  fields:
    code:
      name: TYXAL installer code
      description: Installer code for the CS8000.
      required: true
      selector:
        text:
          type: password
configure_alarm_product:
  name: Configure alarm product
  description: Enable or disable a TYXAL product, assign it to a zone, or perform both changes together.
  target:
    entity:
      integration: deltadore_tydom
      domain: alarm_control_panel
  fields:
    code:
      name: TYXAL installer code
      description: Installer code used while the CS8000 is in maintenance mode.
      required: true
      selector:
        text:
          type: password
    product_id:
      name: Product ID
      description: Product identifier returned by Get alarm products and zones.
      required: true
      selector:
        number:
          min: 0
          mode: box
    active:
      name: Active
      description: Whether the product should participate in the alarm system. Leave empty to keep its current setting.
      required: false
      selector:
        boolean:
    zone:
      name: Zone
      description: Zone to which the product should be assigned. Leave empty to keep its current assignment.
      required: false
      selector:
        number:
          min: 0
          max: 7
          mode: box
rename_alarm_zone:
  name: Rename alarm zone
  description: Change the custom name of one TYXAL alarm zone, or clear it by supplying an empty name.
  target:
    entity:
      integration: deltadore_tydom
      domain: alarm_control_panel
  fields:
    code:
      name: TYXAL installer code
      description: Installer code used while the CS8000 is in maintenance mode.
      required: true
      selector:
        text:
          type: password
    zone_id:
      name: Zone ID
      description: Zone identifier returned by Get alarm products and zones.
      required: true
      selector:
        number:
          min: 0
          max: 7
          mode: box
    name:
      name: Zone name
      description: New custom name for the zone. Supply an empty string to clear its custom or standard label.
      required: true
      selector:
        text:
reload_devices:
  name: Reload devices
  description: Recharger tous les appareils et entités comme au démarrage initial. Cette action supprime toutes les entités existantes et les recrée depuis zéro.
activate_group_scenario:
  name: Activate scenario on group
  description: Activate a scenario on a Tydom group
  target:
    entity:
      integration: deltadore_tydom
      domain: button
  fields:
    scenario_id:
      name: Scenario ID
      description: The ID of the scenario to activate
      required: true
      selector:
        text:
create_scene:
  name: Create or update scene
  description: Create or update a Tydom scene with specific entities. This allows you to modify which entities are controlled by a Tydom scene in Home Assistant.
  target:
    entity:
      integration: deltadore_tydom
      domain: scene
  fields:
    entities:
      name: Entities
      description: Dictionary of entities and their states to include in the scene
      required: true
      selector:
        object:
control_group:
  name: Control group
  description: Control a Tydom group with specific action (turn on/off, open/close, stop, set position)
  target:
    entity:
      integration: deltadore_tydom
      domain: button
  fields:
    action:
      name: Action
      description: Action to perform on the group
      required: true
      selector:
        select:
          options:
            - label: Turn on
              value: turn_on
            - label: Turn off
              value: turn_off
            - label: Open
              value: open
            - label: Close
              value: close
            - label: Stop
              value: stop
            - label: Set position
              value: set_position
    position:
      name: Position
      description: Position for covers (0-100), required when action is set_position
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 1
get_group_devices:
  name: Get group devices
  description: Get the list of devices in a Tydom group
  target:
    entity:
      integration: deltadore_tydom
      domain: button
